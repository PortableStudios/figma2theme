name: Run tests
on:
  pull_request:
  push:
    branches:
      - develop
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Build and install the CLI
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          npm install --global --ignore-scripts .

      - name: Generate the theme
        run: pnpm concurrently --group "figma2theme generate-json --latest-changes" "figma2theme generate-chakra --latest-changes" "figma2theme generate-tailwind --latest-changes"
        env:
          FIGMA_API_KEY: ${{secrets.FIGMA_API_KEY}}

      - name: Archive the theme
        uses: actions/upload-artifact@v4
        with:
          name: theme
          path: |
            ./tokens.json
            ./theme
            ./tailwind.figma2theme.js

      - name: Test, lint and typecheck the project and build Storybook
        run: pnpm concurrently --group "pnpm:test" "pnpm:lint" "pnpm:typecheck" "pnpm:build-storybook"

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Serve Storybook and run tests
        run: pnpm concurrently -k -s first -n "SB,TEST" -c "magenta,blue" "pnpm http-server storybook-static --port 6006 --silent" "pnpm wait-on http://127.0.0.1:6006 && pnpm test-storybook --url http://127.0.0.1:6006"
